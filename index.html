<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jefatura de Estudios</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #334155;
            margin: 0;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #cbd5e1;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #2563eb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h3>Conectando con el Portal de Jefatura...</h3>
    <p id="subtext">Redirigiendo automáticamente...</p>
    <p><a id="manualLink" href="#">Haz clic aquí si no redirige automáticamente</a></p>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxArmYbHCtK_8m68ar3NyD-8ik1y4i8bjuofvkcHAsomXkGT-MNVX5aJPWy6OKMk9rD/exec";
        const PARAMS = "?p=admin";
        const destino = WEB_APP_URL + PARAMS;

        document.getElementById('manualLink').href = destino;

        // Redirección inmediata al destino de Google Apps Script
        window.location.replace(destino);
    </script>
</body>
</html>
