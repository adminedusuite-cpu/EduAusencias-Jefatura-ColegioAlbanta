<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="appTitle">Jefatura de Estudios</title>
    
    <!-- Icono y accesos directos móviles -->
    <link rel="icon" id="favicon" href="logo-jefatura.png" type="image/png">
    <link rel="apple-touch-icon" id="appleTouch" href="logo-jefatura.png">
    
    <meta name="apple-mobile-web-app-title" content="Jefatura">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }

        /* Pantalla de carga */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo {
            max-width: 110px;
            height: auto;
            animation: pulse 2s infinite;
        }

        .mensaje {
            color: #64748b;
            margin-top: 20px;
            font-weight: 500;
            font-size: 15px;
        }

        /* Marco Iframe a pantalla completa */
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de carga suave -->
    <div id="loader">
        <img id="appLogo" src="logo-jefatura.png" class="logo" alt="Logo Portal Jefatura">
        <p id="appStatus" class="mensaje">Cargando Portal de Jefatura...</p>
    </div>

    <!-- Aplicación embebida -->
    <iframe id="appFrame" src="" allow="geolocation; microphone; camera"></iframe>

    <script>
        /* ==========================================================================
           CONFIGURACIÓN GLOBAL DE LA APLICACIÓN (MARCA BLANCA)
           ========================================================================== */
        
        // 1. URL ejecutable de Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxArmYbHCtK_8m68ar3NyD-8ik1y4i8bjuofvkcHAsomXkGT-MNVX5aJPWy6OKMk9rD/exec"; 

        // 2. Parámetro para abrir el modo Jefatura / Administración
        const PARAMS = "?p=admin"; 

        /* ==========================================================================
           INICIALIZACIÓN
           ========================================================================== */
        
        function cargarApp() {
            const iframe = document.getElementById('appFrame');
            const loader = document.getElementById('loader');

            // Asignar el destino al iframe
            iframe.src = WEB_APP_URL + PARAMS;

            // Cuando el Apps Script termine de cargar, ocultar la pantalla de carga
            iframe.onload = function() {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            };
        }

        window.addEventListener('DOMContentLoaded', cargarApp);
    </script>
</body>
</html>
